[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-insurance-analytics"
version = "0.2.0"
description = "Motor insurance technical pricing, claims, reserving, and fraud-triage analytics platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Murat Miraç Gedik" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "matplotlib>=3.8"
]

[project.scripts]
motor-insurance-pipeline = "motor_insurance.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
